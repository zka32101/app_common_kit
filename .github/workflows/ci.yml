name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r tools/icon_gen/requirements.txt
      - run: python -m unittest discover -s tools/icon_gen -v
      - run: python tools/icon_gen/icon_gen.py --spec tools/icon_gen/specs/sample.json --out build/icons
      - run: python tools/icon_gen/check_icons.py --spec tools/icon_gen/specs/sample.json --out build/icons
      - uses: actions/upload-artifact@v4
        with:
          name: icons
          path: build/icons
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build example (web)
        working-directory: example
        run: |
          flutter pub get
          flutter build web
      - name: Install Playwright
        working-directory: example/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Serve and check
        working-directory: example
        run: |
          (cd build/web && python3 -m http.server 8099 >/dev/null 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:8099/ >/dev/null && break; sleep 1; done
          node e2e/check.js e2e/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: example/e2e/shots
          if-no-files-found: ignore
