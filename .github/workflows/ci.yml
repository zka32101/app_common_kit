name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r tools/icon_gen/requirements.txt
      - run: python -m unittest discover -s tools/icon_gen -v
      - run: python tools/icon_gen/icon_gen.py --spec tools/icon_gen/specs/sample.json --out build/icons
      - run: python tools/icon_gen/check_icons.py --spec tools/icon_gen/specs/sample.json --out build/icons
      - uses: actions/upload-artifact@v4
        with:
          name: icons
          path: build/icons
